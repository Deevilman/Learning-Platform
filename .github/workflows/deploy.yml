name: Test og deploy til GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Værktøjer til kodeopgavernes referenceløsninger (C#, NASM)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm mono-mcs
      - name: Byg indhold (validerer alle kurser)
        id: content
        run: npm run content
      - name: Fejl i et kursus → issue
        if: failure() && steps.content.outcome == 'failure' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Et kursus kunne ikke bygges"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file content-build-errors.md
          else gh issue create --title "$title" --body-file content-build-errors.md; fi
      - name: Unit-tests (importer, generatorer, mestring, lagring, udvidelighed)
        run: npm test
      - name: "Tjek video-ID'er (blødt — fejler ikke uden netværk)"
        run: npm run verify-videos
      - name: Typecheck og build
        run: npx tsc --noEmit && npx vite build
      - name: Skjulte tests til dommeren (Supabase)
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/upload-judge-tests.ts
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
